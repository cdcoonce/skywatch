[project]
name = "skywatch"
version = "0.1.0"
description = "A synthetic sky survey where detectors compete to tell science from glitches"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17",
    "duckdb>=1.1",
]

[project.scripts]
skywatch = "skywatch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skywatch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
